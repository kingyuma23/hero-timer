<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>もぐもぐヒーロー</title>
    
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background: linear-gradient(135deg, #0B132B, #1C2541, #0a0a1a);
    color: #fff;
    height: 100vh;
    overflow: hidden; /* Prevent scrolling on iPad */
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation; /* Prevent double-tap zoom */
    user-select: none;
    -webkit-user-select: none;
}

#app.landscape-layout {
    width: 100%;
    max-width: 1200px;
    height: 100%;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    padding: 3vh 4vw;
    gap: 3vw;
}

.left-panel, .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
    height: 100%;
}

.glass-panel {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 40px;
    padding: 3vh 2vw;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.05);
}

/* ヒーローエリア */
.hero-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
}

.hero-mask {
    width: 32vh;
    height: 32vh;
    max-width: 300px;
    max-height: 300px;
    /* たべるたびに --hero-scale が大きくなり、ヒーローが育つ */
    transform: scale(var(--hero-scale, 1));
    transform-origin: center 75%;
    transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    filter: drop-shadow(0 0 30px rgba(79, 172, 254, 0.5));
}

.hero-mask.eating {
    transform: scale(calc(var(--hero-scale, 1) * 1.15)) translateY(-10px);
}

.hero-mask.happy {
    transform: scale(calc(var(--hero-scale, 1) * 1.2)) translateY(-20px) rotate(5deg);
    filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.8));
}

.eye {
    transition: fill 0.3s;
}

.hero-mask.happy .eye {
    filter: brightness(1.5) hue-rotate(-50deg); /* 黄金に光るようなイメージ */
}

.speech-bubble {
    background: rgba(255, 255, 255, 0.95);
    color: #1a1a1a;
    padding: 15px 30px;
    border-radius: 30px;
    font-size: 1.5rem;
    font-weight: 900;
    margin-top: 20px;
    position: relative;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.3s, transform 0.3s;
    text-align: center;
}

.speech-bubble.show {
    opacity: 1;
    transform: translateY(0);
}

.speech-bubble::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 0 15px 15px 15px;
    border-style: solid;
    border-color: transparent transparent rgba(255, 255, 255, 0.95) transparent;
}

/* 進捗ゲージ */
.progress-section {
    width: 100%;
    padding: 0 5%;
}

.progress-label {
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    letter-spacing: 2px;
}

.progress-bar-container {
    width: 100%;
    height: 40px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
    border: 3px solid #555;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff4b4b, #ff0000, #ff8c00, #ffd700);
    background-size: 200% 100%;
    border-radius: 17px;
    transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    animation: gradientMove 2s linear infinite;
    position: relative;
}

.progress-bar::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0.3) 0%, transparent 50%, rgba(0,0,0,0.2) 100%);
    border-radius: 17px;
}

@keyframes gradientMove {
    0% { background-position: 100% 0%; }
    100% { background-position: -100% 0%; }
}

.timer-section {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.clock-container {
    width: 32vh;
    height: 32vh;
    max-width: 300px;
    max-height: 300px;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
}

.clock-svg {
    width: 100%;
    height: 100%;
    display: block;
}

#timeSlice {
    transition: stroke-dashoffset 0.5s linear, stroke 0.3s;
}

.timer-display {
    font-size: 4.5rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px rgba(79, 172, 254, 0.8);
    margin-bottom: 20px;
    letter-spacing: 3px;
    color: #4facfe;
}

.timer-display.danger {
    color: #ff4b4b;
    text-shadow: 0 0 20px rgba(255, 75, 75, 0.8);
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
}

.timer-controls {
    display: flex;
    gap: 20px;
}

.small-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    color: white;
    padding: 15px 30px;
    border-radius: 30px;
    font-size: 1.5rem;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: all 0.2s;
}

.small-btn.start-btn {
    background: rgba(0, 255, 100, 0.2);
    border-color: rgba(0, 255, 100, 0.5);
    color: #00ff64;
}

.small-btn.start-btn.running {
    background: rgba(255, 150, 0, 0.2);
    border-color: rgba(255, 150, 0, 0.5);
    color: #ffb400;
}

.small-btn:active {
    transform: scale(0.95);
}

/* 変身ベルトボタン */
.belt-container {
    width: 100%;
    display: flex;
    justify-content: center;
}

.belt-button {
    background: #111;
    width: 280px;
    height: 110px;
    border-radius: 55px;
    position: relative;
    border: 5px solid #444;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 5px 15px rgba(255,255,255,0.2);
    cursor: pointer;
    outline: none;
    transition: transform 0.1s;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
}

.belt-button:active {
    transform: scale(0.95) translateY(5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.8);
}

.belt-core {
    width: 90px;
    height: 90px;
    background: radial-gradient(circle, #ff0000 0%, #800000 100%);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 30px rgba(255,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.5);
    border: 5px solid #111;
    z-index: 2;
    transition: all 0.3s;
}

.belt-text {
    color: white;
    font-size: 1.5rem;
    font-weight: 900;
    text-shadow: 2px 2px 4px black;
    pointer-events: none;
}

.belt-button.active .belt-core {
    background: radial-gradient(circle, #00ff00 0%, #008000 100%);
    box-shadow: 0 0 50px rgba(0,255,0,0.9), inset 0 0 20px rgba(255,255,255,0.8);
    transform: rotate(360deg) scale(1.1);
}

.belt-ring {
    position: absolute;
    width: 80px;
    height: 100%;
    background: linear-gradient(90deg, #444, #aaa, #444);
    z-index: 1;
}

.ring-left { left: 0; }
.ring-right { right: 0; }

/* Confetti Container */
#confetti-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
}

/* ===== もぐもぐクールダウン ===== */

/* もぐもぐちゅう：ベルトが暗くなり、コアがゆっくり脈打つ */
.belt-button.cooldown {
    filter: grayscale(0.5) brightness(0.75);
    cursor: default;
}
.belt-button.cooldown:active {
    transform: none;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 5px 15px rgba(255,255,255,0.2);
}
.belt-button.cooldown .belt-core {
    background: radial-gradient(circle, #ff9800 0%, #7a4a00 100%);
    box-shadow: 0 0 20px rgba(255,152,0,0.6), inset 0 0 10px rgba(255,255,255,0.4);
    animation: chew-pulse 0.8s ease-in-out infinite;
}
.belt-button.cooldown .belt-text {
    font-size: 1.2rem;
}
@keyframes chew-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
}

/* ごっくん完了：また押せるよ！のキラキラ */
.belt-button.ready .belt-core {
    animation: ready-glow 0.9s ease-in-out infinite;
}
@keyframes ready-glow {
    0%, 100% { box-shadow: 0 0 30px rgba(255,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.5); }
    50% { box-shadow: 0 0 60px rgba(255,230,0,1), inset 0 0 20px rgba(255,255,255,0.9); }
}

/* クールダウン中に押したときのぷるぷる */
.belt-button.shake {
    animation: belt-shake 0.4s;
}
@keyframes belt-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-5px); }
}

/* ヒーローのもぐもぐアニメーション（成長スケールと衝突しないようsvgに適用） */
.hero-mask.chewing svg {
    animation: hero-chew 0.7s ease-in-out infinite;
    transform-origin: center 70%;
}
@keyframes hero-chew {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.93) scaleX(1.04); }
}

/* ===== 進化エフェクト ===== */
.hero-mask.evolving svg {
    animation: evolve-pop 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes evolve-pop {
    0%   { transform: scale(0.2) rotate(-15deg); filter: brightness(4) saturate(0); }
    55%  { transform: scale(1.2) rotate(6deg); filter: brightness(1.6); }
    100% { transform: scale(1) rotate(0); filter: brightness(1); }
}

/* ===== ずかん・せっていボタン ===== */
.top-buttons {
    position: fixed;
    top: 12px;
    right: 14px;
    display: flex;
    gap: 10px;
    z-index: 300;
}
.icon-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(20,30,50,0.75);
    font-size: 1.35rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s;
}
.icon-btn:active { transform: scale(0.9); }

/* ===== モーダル共通 ===== */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 12, 0.68);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
}
.modal-overlay.hidden { display: none; }
.modal {
    background: rgba(15, 25, 45, 0.96);
    border: 2px solid rgba(79, 172, 254, 0.45);
    border-radius: 24px;
    padding: 18px 22px 22px;
    width: min(92vw, 660px);
    max-height: 86vh;
    overflow-y: auto;
    color: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    -webkit-overflow-scrolling: touch;
}
.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}
.modal-header h2 { font-size: 1.25rem; margin: 0; }
.close-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 1.4rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* ===== スタンプ＆れんぞく ===== */
.streak-count { font-size: 1.1rem; font-weight: 900; margin-bottom: 8px; }
.stamp-row { display: flex; gap: 8px; margin-bottom: 8px; }
.stamp {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 46px;
    padding: 6px 0;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
}
.stamp.got { background: rgba(255,215,0,0.22); }
.stamp-mark { font-size: 1.1rem; }
.stamp-day { font-size: 0.62rem; color: #aac; }
.streak-bonus { font-size: 0.85rem; font-weight: 700; color: #ffd700; margin-bottom: 14px; }
.streak-bonus.dim { color: #8aa; }

/* ===== ずかんグリッド ===== */
.dex-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}
.dex-cell {
    background: rgba(255,255,255,0.07);
    border-radius: 16px;
    padding: 10px 6px 8px;
    text-align: center;
}
.dex-icon svg { width: 100%; height: auto; display: block; }
.dex-cell.locked .dex-icon svg { filter: brightness(0) opacity(0.45); }
.dex-name { font-size: 0.68rem; margin-top: 4px; font-weight: 700; line-height: 1.3; }

/* ===== せってい ===== */
.setting-row { margin-bottom: 18px; }
.setting-row label {
    display: block;
    font-size: 0.85rem;
    color: #9fc4ff;
    margin-bottom: 8px;
    font-weight: 700;
}
.opt-group { display: flex; flex-wrap: wrap; gap: 8px; }
.opt-btn {
    padding: 10px 16px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
}
.opt-btn.selected {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #06213a;
    border-color: transparent;
}

</style>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="landscape-layout">
        <div class="top-buttons">
            <button class="icon-btn" id="btnDex" aria-label="ずかん">📖</button>
            <button class="icon-btn" id="btnSettings" aria-label="せってい">⚙️</button>
        </div>
        <div class="left-panel glass-panel">
            <!-- ヒーロー登場エリア -->
            <div class="hero-container">
                <div class="hero-mask" id="heroMask">
                    <!-- 可愛いヒーローマスクのSVG -->
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<ellipse cx="100" cy="115" rx="60" ry="72" fill="#fffaf0" stroke="#f0dcc0" stroke-width="5"/>

<circle cx="84.5" cy="108" r="2.5" fill="#fff"/>
<circle cx="120.5" cy="108" r="2.5" fill="#fff"/>
<ellipse cx="64" cy="127" rx="9" ry="6" fill="#ffc2cc"/>

<path class="mouth" d="M 91 129 Q 100 138 109 129" fill="none" stroke="#e08585" stroke-width="4" stroke-linecap="round"/>
</svg>
                </div>
                <div class="speech-bubble" id="message">たべると…しんかするよ！</div>
            </div>

            <!-- ヒーローエネルギーゲージ (進捗) -->
            <div class="progress-section">
                <div class="progress-label">ヒーローエネルギー</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                    <div class="progress-glow"></div>
                </div>
            </div>

            <!-- 変身ベルト風 もぐもぐボタン -->
            <div class="belt-container" id="beltContainer">
                <button class="belt-button" id="btnEat">
                    <div class="belt-core" id="beltCore">
                        <span class="belt-text">たべたよ！</span>
                    </div>
                    <div class="belt-ring ring-left"></div>
                    <div class="belt-ring ring-right"></div>

        </div>

        <div class="right-panel glass-panel">
            <!-- 制限時間タイマー -->
            <div class="timer-section">
                <div class="clock-container">

                        <!-- 文字盤 -->
                        <circle cx="50" cy="50" r="48" fill="rgba(10, 20, 40, 0.85)" stroke="#4facfe" stroke-width="2"/>
                        <circle cx="50" cy="50" r="49" fill="none" stroke="rgba(79, 172, 254, 0.3)" stroke-width="2" filter="url(#glow)"/>
                        <!-- 残り時間の赤い扇形（長針の位置から残り分だけ塗る） -->

                                transform="rotate(-90 50 50)" id="timeSlice"/>
                        <!-- 目盛り -->

                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(0 50 50)"/>

                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(120 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(126 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(132 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(138 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(144 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(150 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(156 50 50)"/>

<path class="mouth" d="M 82 158 Q 100 178 118 158" fill="none" stroke="#b197fc" stroke-width="5" stroke-linecap="round"/></svg>` }
    };

    // 進化ツリー：各ステージの候補（w = 出やすさ）
    const STAGE_BRANCHES = [
        [{ id: 'egg', w: 1 }], // ※れんぞく3日以上でゴールドたまごに！
        [{ id: 'puni', w: 1 }, { id: 'momo', w: 1 }],
        [{ id: 'chibi', w: 1 }, { id: 'mori', w: 1 }, { id: 'sora', w: 1 }],
        [{ id: 'hero', w: 1 }, { id: 'flame', w: 1 }, { id: 'aqua', w: 1 }],
        [{ id: 'gold', w: 3 }, { id: 'rainbow', w: 1 }] // レインボーはレア！
    ];
    const DEX_ORDER = ['egg', 'egg_gold', 'puni', 'momo', 'chibi', 'mori', 'sora', 'hero', 'flame', 'aqua', 'gold', 'rainbow'];

    // ===== モグずかん =====
    let dex = store.get('mogu-dex', []);
    function collect(id) {
        if (!dex.includes(id)) {
            dex.push(id);
            store.set('mogu-dex', dex);
        }
    }

    // ===== 完食スタンプ＆れんぞく記録 =====
    function dateKey(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${dd}`;
    }
    function getStamps() { return store.get('mogu-stamps', {}); }
    function getStreak() {
        const stamps = getStamps();
        const d = new Date();
        if (!stamps[dateKey(d)]) d.setDate(d.getDate() - 1); // 今日まだなら昨日から数える
        let n = 0;
        while (stamps[dateKey(d)]) { n++; d.setDate(d.getDate() - 1); }
        return n;
    }
    function recordClear() {
        const stamps = getStamps();
        stamps[dateKey(new Date())] = true;
        store.set('mogu-stamps', stamps);
        return getStreak();
    }

    // ===== 効果音（Web Audio API・音声ファイル不要） =====
    let audioCtx = null;
    function ensureAudio() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) {}
    }
    function tone(freq, start, dur, type, vol) {
        const t0 = audioCtx.currentTime + start;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || 'sine';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(t0);
        o.stop(t0 + dur + 0.05);
    }
    const SFX = {
        munch()   { tone(240, 0, 0.08, 'square', 0.10); tone(190, 0.09, 0.08, 'square', 0.08); },
        blocked() { tone(150, 0, 0.18, 'sawtooth', 0.06); },
        gulp()    { tone(420, 0, 0.09, 'sine', 0.14); tone(300, 0.08, 0.09, 'sine', 0.14); tone(200, 0.16, 0.16, 'sine', 0.14); },
        ready()   { tone(880, 0, 0.12, 'sine', 0.14); tone(1320, 0.1, 0.16, 'sine', 0.11); },
        evolve()  { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.26, 'triangle', 0.15)); },
        clear()   { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * 0.1, 0.32, 'triangle', 0.15)); },
        warn()    { tone(740, 0, 0.2, 'sine', 0.12); tone(740, 0.3, 0.2, 'sine', 0.12); },
        timeup()  { tone(660, 0, 0.35, 'sine', 0.14); tone(660, 0.45, 0.35, 'sine', 0.14); tone(660, 0.9, 0.5, 'sine', 0.14); }
    };
    function play(name) {
        if (!settings.sound) return;
        ensureAudio();
        if (!audioCtx) return;
        try { SFX[name](); } catch (e) {}
    }

    // ===== 声（Web Speech API） =====
    function speak(text) {
        if (!settings.voice) return;
        try {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'ja-JP';
            u.rate = 1.0;
            u.pitch = 1.35;
            speechSynthesis.speak(u);
        } catch (e) {}
    }

    // ===== State =====
    let timerInterval = null;
    let totalSeconds = 30 * 60;
    let isRunning = false;
    let warnedFiveMin = false;
    let currentBites = 0;
    let mealPath = {};   // このごはんの進化ルート {stageIdx: charId}
    let currentStage = -1;

    const messages = [
        "すごい！",
        "そのちょうし！",
        "もぐもぐ！",
        "かっこいい！",
        "ぱわーあっぷ！",
        "さいこう！",
        "えねるぎーちゃーじ！",
        "ひーろーみたい！",
        "いいぞいいぞ！"
    ];

    // ===== 進化 =====
    function stageThresholds() {
        return [0, 0.25, 0.5, 0.75, 1].map(k => Math.round(k * settings.maxBites));
    }
    function pickBranch(idx) {
        if (mealPath[idx]) return mealPath[idx];
        let id;
        if (idx === 0) {
            id = getStreak() >= 3 ? 'egg_gold' : 'egg'; // れんぞくボーナス
        } else {
            const pool = STAGE_BRANCHES[idx];
            const total = pool.reduce((s, c) => s + c.w, 0);
            let r = Math.random() * total;
            for (const c of pool) { r -= c.w; if (r <= 0) { id = c.id; break; } }
            if (!id) id = pool[0].id;
        }
        mealPath[idx] = id;
        return id;
    }
    function updateHeroStage(silent) {
        const th = stageThresholds();
        let idx = 0;
        for (let i = 0; i < th.length; i++) {
            if (currentBites >= th[i]) idx = i;
        }
        if (idx === currentStage) return false;
        const evolved = currentStage >= 0 && idx > currentStage;
        currentStage = idx;
        const charId = pickBranch(idx);
        const ch = CHARACTERS[charId];
        heroMask.innerHTML = ch.svg;
        collect(charId);
        if (evolved && !silent) {
            heroMask.classList.add('evolving');
            setTimeout(() => heroMask.classList.remove('evolving'), 900);
            showMessage(`しんか！「${ch.name}」になった！`);
            play('evolve');
            speak(`しんか！${ch.name.replace(/[✨🌈]/g, '')}になった！`);
            if (typeof confetti === 'function') {
                confetti({ particleCount: 70, spread: 90, startVelocity: 35, origin: { x: 0.28, y: 0.45 }, zIndex: 9999 });
            }
        }
        return evolved;
    }

    // ===== ヒーローの成長（たべるたびに大きくなる） =====
    const heroMinScale = 0.5;
    const heroMaxScale = 1.15;
    function updateHeroSize() {
        const t = Math.min(currentBites / settings.maxBites, 1);
        const s = heroMinScale + (heroMaxScale - heroMinScale) * t;
        heroMask.style.setProperty('--hero-scale', s.toFixed(3));
    }

    // ===== もぐもぐクールダウン（よく噛む時間） =====
    let cooldownRemaining = 0;
    let cooldownInterval = null;
    let busyMessageAt = 0;

    function startCooldown() {
        cooldownRemaining = settings.cooldown;
        btnEat.classList.remove('ready');
        btnEat.classList.add('cooldown');
        heroMask.classList.add('chewing');
        beltText.textContent = `もぐもぐ ${cooldownRemaining}`;

        clearInterval(cooldownInterval);
        cooldownInterval = setInterval(() => {
            cooldownRemaining--;
            if (cooldownRemaining > 0) {
                beltText.textContent = `もぐもぐ ${cooldownRemaining}`;
            } else {
                endCooldown();
            }
        }, 1000);
    }
    function endCooldown() {
        clearInterval(cooldownInterval);
        cooldownRemaining = 0;
        btnEat.classList.remove('cooldown');
        btnEat.classList.add('ready');
        heroMask.classList.remove('chewing');
        beltText.textContent = 'たべたよ！';
        showMessage('ごっくん！つぎのひとくちどうぞ！');
        play('ready');
    }
    function cancelCooldown() {
        clearInterval(cooldownInterval);
        cooldownRemaining = 0;
        btnEat.classList.remove('cooldown', 'ready');
        heroMask.classList.remove('chewing');
        beltText.textContent = 'たべたよ！';
    }

    // ===== タイマー =====
    function updateTimerDisplay() {
        if (totalSeconds < 0) totalSeconds = 0;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

        if (totalSeconds <= 5 * 60 && totalSeconds > 0) {
            timerDisplay.classList.add('danger');
            if (timeSlice) timeSlice.setAttribute('stroke', '#ff0000');
        } else {
            timerDisplay.classList.remove('danger');
            if (timeSlice) timeSlice.setAttribute('stroke', '#ff4b4b');
        }
    }

    // 本物の時計：実際の時刻を針で表示し、長針の先から残り時間ぶんを赤く塗る
    function updateClock() {
        const now = new Date();
        const sec = now.getSeconds() + now.getMilliseconds() / 1000;
        const min = now.getMinutes() + sec / 60;
        const hr = (now.getHours() % 12) + min / 60;

        if (hourHand) hourHand.setAttribute('transform', `rotate(${hr * 30} 50 50)`);
        if (minuteHand) minuteHand.setAttribute('transform', `rotate(${min * 6} 50 50)`);
        if (secondHand) secondHand.setAttribute('transform', `rotate(${sec * 6} 50 50)`);

        if (timeSlice) {
            const circumference = 125.664; // 2 * PI * r (r=20)
            let fraction = totalSeconds / 3600;
            if (fraction > 1) fraction = 1;
            if (fraction < 0) fraction = 0;
            timeSlice.setAttribute('transform', `rotate(${min * 6 - 90} 50 50)`);
            timeSlice.style.strokeDasharray = `${circumference * fraction} ${circumference}`;
            timeSlice.style.strokeDashoffset = 0;
        }
    }

    function toggleTimer() {
        if (isRunning) {
            clearInterval(timerInterval);
            btnStart.textContent = "スタート";
            btnStart.classList.remove('running');
        } else {
            if (totalSeconds <= 0) return;
            if (totalSeconds > 5 * 60) warnedFiveMin = false;
            timerInterval = setInterval(() => {
                totalSeconds--;
                updateTimerDisplay();
                if (totalSeconds === 5 * 60 && !warnedFiveMin) {
                    warnedFiveMin = true;
                    showMessage('あと5ふん！');
                    play('warn');
                    speak('あと5ふんだよ');
                }
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    btnStart.textContent = "スタート";
                    btnStart.classList.remove('running');
                    showMessage("じかんになったよ！");
                    play('timeup');
                    speak('じかんになったよ');
                }
            }, 1000);
            btnStart.textContent = "ストップ";
            btnStart.classList.add('running');
        }
        isRunning = !isRunning;
    }

    function addTime(mins) {
        totalSeconds += mins * 60;
        if (totalSeconds < 0) totalSeconds = 0;
        if (totalSeconds > 5 * 60) warnedFiveMin = false;
        updateTimerDisplay();
    }

    // ===== メッセージ =====
    let messageTimeout;
    function showMessage(text) {
        message.textContent = text;
        message.classList.add('show');
        clearTimeout(messageTimeout);
        messageTimeout = setTimeout(() => {
            message.classList.remove('show');
        }, 3000);
    }

    // ===== たべたよ！ =====
    function eatAction() {
        ensureAudio();

        // もぐもぐちゅうは押せない（よく噛もう！）
        if (cooldownRemaining > 0) {
            const now = Date.now();
            if (now - busyMessageAt > 2000) {
                busyMessageAt = now;
                showMessage('まだもぐもぐちゅう！よくかんでね');
                play('blocked');
            }
            btnEat.classList.add('shake');
            setTimeout(() => btnEat.classList.remove('shake'), 400);
            return;
        }
        btnEat.classList.remove('ready');

        heroMask.classList.add('eating');
        btnEat.classList.add('active');
        setTimeout(() => {
            heroMask.classList.remove('eating');
            btnEat.classList.remove('active');
        }, 300);

        if (currentBites < settings.maxBites) {
            currentBites++;
            play('munch');
            const percentage = Math.min(currentBites / settings.maxBites, 1) * 100;
            progressBar.style.width = `${percentage}%`;
            updateHeroSize();
            const evolved = updateHeroStage(); // 進化チェック

            if (currentBites >= settings.maxBites) {
                // Clear!
                cancelCooldown();
                heroMask.classList.add('happy');
                const streak = recordClear();
                const streakText = streak >= 2 ? `🔥${streak}にちれんぞく！` : '';
                setTimeout(() => {
                    showMessage(`みっしょんくりあ！！${streakText}`);
                    play('clear');
                    speak(`ミッションクリア！ぜんぶたべたね！${streak >= 2 ? streak + 'にちれんぞく、すごい！' : 'えらい！'}`);
                }, evolved ? 1500 : 0);
                fireConfetti();
                if (isRunning) toggleTimer(); // Stop timer
            } else {
                if (!evolved) {
                    const msg = messages[Math.floor(Math.random() * messages.length)];
                    showMessage(msg);
                }
                startCooldown(); // よく噛む時間スタート
            }
        } else {
            // Already finished
            heroMask.classList.add('happy');
            setTimeout(() => heroMask.classList.remove('happy'), 500);
            fireConfetti();
        }
    }

    function fireConfetti() {
        if (typeof confetti !== 'function') return;
        const duration = 3 * 1000;
        const animationEnd = Date.now() + duration;
        const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999, colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff'] };
        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }
        const interval = setInterval(function() {
            const timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) {
                return clearInterval(interval);
            }
            const particleCount = 50 * (timeLeft / duration);
            confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
            confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
        }, 250);
    }

    // ===== リセット =====
    function resetApp() {
        if (isRunning) {
            clearInterval(timerInterval);
            isRunning = false;
            btnStart.textContent = "スタート";
            btnStart.classList.remove('running');
        }
        cancelCooldown();
        totalSeconds = 30 * 60;
        currentBites = 0;
        warnedFiveMin = false;
        mealPath = {};
        currentStage = -1;

        updateTimerDisplay();
        progressBar.style.width = '0%';
        updateHeroSize();
        updateHeroStage(true); // たまごに戻る
        heroMask.classList.remove('happy', 'eating', 'chewing');
        message.classList.remove('show');

        if (typeof confetti === 'function' && confetti.reset) {
            confetti.reset();
        }
    }

    // ===== ずかん＆せってい モーダル =====
    function openModal(m) { m.classList.remove('hidden'); }
    function closeModal(m) { m.classList.add('hidden'); }
    document.querySelectorAll('.modal-overlay').forEach(ov => {
        ov.addEventListener('click', (e) => {
            if (e.target === ov || e.target.hasAttribute('data-close')) closeModal(ov);
        });
    });

    function renderDex() {
        const stamps = getStamps();
        const streak = getStreak();
        const dayNames = ['にち', 'げつ', 'か', 'すい', 'もく', 'きん', 'ど'];
        let row = '';
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const got = !!stamps[dateKey(d)];
            row += `<div class="stamp ${got ? 'got' : ''}"><span class="stamp-mark">${got ? '⭐' : '・'}</span><span class="stamp-day">${dayNames[d.getDay()]}</span></div>`;
        }
        const bonus = streak >= 3 ? '<div class="streak-bonus">🥚 ゴールドたまごボーナスちゅう！</div>' :
            '<div class="streak-bonus dim">3にちれんぞくでゴールドたまごに！</div>';
        streakBox.innerHTML = `<div class="streak-count">🔥 れんぞく ${streak} にち</div><div class="stamp-row">${row}</div>${bonus}`;

        dexGrid.innerHTML = DEX_ORDER.map(id => {
            const ch = CHARACTERS[id];
            const got = dex.includes(id);
            return `<div class="dex-cell ${got ? '' : 'locked'}"><div class="dex-icon">${ch.svg}</div><div class="dex-name">${got ? ch.name : '？？？'}</div></div>`;
        }).join('');
    }

    function optButtons(container, values, labels, current, onPick) {
        container.innerHTML = '';
        values.forEach((v, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn' + (v === current ? ' selected' : '');
            b.textContent = labels[i];
            b.addEventListener('click', () => { onPick(v); renderSettings(); });
            container.appendChild(b);
        });
    }
    function renderSettings() {
        optButtons(document.getElementById('optBites'),
            [10, 15, 20, 25, 30],
            ['10くち', '15くち', '20くち', '25くち', '30くち'],
            settings.maxBites,
            v => {
                settings.maxBites = v;
                saveSettings();
                progressBar.style.width = `${Math.min(currentBites / settings.maxBites, 1) * 100}%`;
                updateHeroSize();
                updateHeroStage(true);
            });
        optButtons(document.getElementById('optCooldown'),
            [5, 10, 20, 30],
            ['5びょう', '10びょう', '20びょう', '30びょう'],
            settings.cooldown,
            v => { settings.cooldown = v; saveSettings(); });
        optButtons(document.getElementById('optSound'),
            [true, false], ['ON', 'OFF'], settings.sound,
            v => { settings.sound = v; saveSettings(); if (v) play('ready'); });
        optButtons(document.getElementById('optVoice'),
            [true, false], ['ON', 'OFF'], settings.voice,
            v => { settings.voice = v; saveSettings(); if (v) speak('こえ、オンにしたよ'); });
    }

    // ===== Event Listeners =====
    btnStart.addEventListener('click', () => { ensureAudio(); toggleTimer(); });
    btnMinus.addEventListener('click', () => addTime(-5));
    btnPlus.addEventListener('click', () => addTime(5));
    btnReset.addEventListener('click', resetApp);
    btnEat.addEventListener('click', eatAction);
    btnDex.addEventListener('click', () => { renderDex(); openModal(dexModal); });
    btnSettings.addEventListener('click', () => { renderSettings(); openModal(settingsModal); });

    // ===== Initial setup =====
    updateTimerDisplay();
    updateHeroSize();
    updateHeroStage(true); // たまごからスタート
    updateClock();
    setInterval(updateClock, 200); // 実時刻の時計は常に動かす

    // モーダル内はスクロール可、それ以外はスクロール抑止（iPad向け）
    document.addEventListener('touchmove', function(e) {
        if (!e.target.closest('.modal')) e.preventDefault();
    }, { passive: false });
});

</script>
    
</body>
</html>
