<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>もぐもぐヒーロー</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="landscape-layout">
        <div class="left-panel glass-panel">
            <!-- ヒーロー登場エリア -->
            <div class="hero-container">
                <div class="hero-mask" id="heroMask">
                    <!-- 可愛いヒーローマスクのSVG -->
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<ellipse cx="100" cy="115" rx="60" ry="72" fill="#fffaf0" stroke="#f0dcc0" stroke-width="5"/>
<circle cx="70" cy="82" r="9" fill="#ffd9e0"/>
<circle cx="133" cy="70" r="7" fill="#c8f2e0"/>
<circle cx="127" cy="155" r="9" fill="#cfe3ff"/>
<circle cx="70" cy="152" r="6" fill="#fff1b8"/>
<ellipse class="eye" cx="82" cy="112" rx="7" ry="9" fill="#3a3a3a"/>
<ellipse class="eye" cx="118" cy="112" rx="7" ry="9" fill="#3a3a3a"/>
<circle cx="84.5" cy="108" r="2.5" fill="#fff"/>
<circle cx="120.5" cy="108" r="2.5" fill="#fff"/>
<ellipse cx="64" cy="127" rx="9" ry="6" fill="#ffc2cc"/>
<ellipse cx="136" cy="127" rx="9" ry="6" fill="#ffc2cc"/>
<path class="mouth" d="M 91 129 Q 100 138 109 129" fill="none" stroke="#e08585" stroke-width="4" stroke-linecap="round"/>
</svg>
                </div>
                <div class="speech-bubble" id="message">たべると…しんかするよ！</div>
            </div>

            <!-- ヒーローエネルギーゲージ (進捗) -->
            <div class="progress-section">
                <div class="progress-label">ヒーローエネルギー</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                    <div class="progress-glow"></div>
                </div>
            </div>

            <!-- 変身ベルト風 もぐもぐボタン -->
            <div class="belt-container" id="beltContainer">
                <button class="belt-button" id="btnEat">
                    <div class="belt-core" id="beltCore">
                        <span class="belt-text">たべたよ！</span>
                    </div>
                    <div class="belt-ring ring-left"></div>
                    <div class="belt-ring ring-right"></div>
                </button>
            </div>
        </div>

        <div class="right-panel glass-panel">
            <!-- 制限時間タイマー -->
            <div class="timer-section">
                <div class="clock-container">
                    <svg class="clock-svg" viewBox="0 0 100 100" id="clockSvg">
                        <!-- 文字盤 -->
                        <circle cx="50" cy="50" r="48" fill="rgba(10, 20, 40, 0.85)" stroke="#4facfe" stroke-width="2"/>
                        <circle cx="50" cy="50" r="49" fill="none" stroke="rgba(79, 172, 254, 0.3)" stroke-width="2" filter="url(#glow)"/>
                        <!-- 残り時間の赤い扇形（長針の位置から残り分だけ塗る） -->
                        <circle cx="50" cy="50" r="20" fill="none" stroke="#ff4b4b" stroke-width="40" opacity="0.75"
                                stroke-dasharray="0 125.664" stroke-dashoffset="0"
                                transform="rotate(-90 50 50)" id="timeSlice"/>
                        <!-- 目盛り -->
                        <g id="clockTicks">
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(0 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(6 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(12 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(18 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(24 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(30 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(36 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(42 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(48 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(54 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(60 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(66 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(72 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(78 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(84 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(90 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(96 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(102 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(108 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(114 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(120 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(126 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(132 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(138 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(144 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(150 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(156 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(162 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(168 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(174 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(180 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(186 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(192 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(198 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(204 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(210 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(216 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(222 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(228 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(234 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(240 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(246 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(252 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(258 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(264 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(270 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(276 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(282 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(288 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(294 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(300 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(306 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(312 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(318 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(324 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="8" stroke="#aaa" stroke-width="2" transform="rotate(330 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(336 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(342 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(348 50 50)"/>
                            <line x1="50" y1="3" x2="50" y2="6" stroke="#555" stroke-width="1" transform="rotate(354 50 50)"/>
                        </g>
                        <!-- 1〜12の数字 -->
                        <g id="clockNumbers">
                            <text x="68.0" y="18.8" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">1</text>
                            <text x="81.2" y="32.0" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">2</text>
                            <text x="86.0" y="50.0" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">3</text>
                            <text x="81.2" y="68.0" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">4</text>
                            <text x="68.0" y="81.2" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">5</text>
                            <text x="50.0" y="86.0" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">6</text>
                            <text x="32.0" y="81.2" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">7</text>
                            <text x="18.8" y="68.0" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">8</text>
                            <text x="14.0" y="50.0" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">9</text>
                            <text x="18.8" y="32.0" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">10</text>
                            <text x="32.0" y="18.8" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">11</text>
                            <text x="50.0" y="14.0" font-size="10" font-weight="bold" fill="#eee" text-anchor="middle" dominant-baseline="central">12</text>
                        </g>
                        <!-- 針（短針・長針・秒針） -->
                        <line x1="50" y1="50" x2="50" y2="27" stroke="#fff" stroke-width="4.5" stroke-linecap="round" id="hourHand"/>
                        <line x1="50" y1="50" x2="50" y2="15" stroke="#fff" stroke-width="3" stroke-linecap="round" id="minuteHand"/>
                        <line x1="50" y1="57" x2="50" y2="13" stroke="#ffd700" stroke-width="1.3" stroke-linecap="round" id="secondHand"/>
                        <circle cx="50" cy="50" r="3.5" fill="#fff"/>
                        <circle cx="50" cy="50" r="1.8" fill="#ff4b4b"/>
                    </svg>
                </div>
                <div class="timer-display" id="timer">30:00</div>
                <div class="timer-controls">
                    <button class="small-btn" id="btnMinus">-5分</button>
                    <button class="small-btn start-btn" id="btnStart">スタート</button>
                    <button class="small-btn" id="btnPlus">+5分</button>
                    <button class="small-btn reset-btn" id="btnReset" style="background: rgba(255,100,100,0.2); border-color: rgba(255,100,100,0.5); color: #ff8080;">リセット</button>
                </div>
            </div>

        </div>
    </div>

    <!-- パーティクルコンテナ -->
    <div id="confetti-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('ServiceWorker registration successful');
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
